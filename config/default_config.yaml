########################
# Execution parameters
########################
#Runtime only for cluster execution
#Threads and Memory for all executions

# Global safety cap for any single job (in MB)
max_mem_mb: 1500000 # 1,500 GB

# Partition mapping (for SLURM or other schedulers): partition_name -> threshold (mem_mb)
account: "general"
partition_ranges:
  main-redhat: 160000
  mem: 1500000

# Default resources for simple or low resource jobs (not requiring dynamic scaling)
simple_job_mem_mb: 5000
simple_job_threads: 8
simple_job_time_min: 1440 # 24 hr

# Resources for rules requiring dynamic scaling (i.e., QC or assembly jobs)
dynamic_threads: &dynamic_default_threads 24
dynamic_time_min: &dynamic_default_time_min 4320 # 72 hr

resources:
  ################
  #### qc.smk ####
  ################
  initialize_qc:
    base_mem_mb: 2000
    scaling_factor: 0.2
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  deduplicate_reads:
    base_mem_mb: 8000
    scaling_factor: 3.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  apply_quality_filter:
    base_mem_mb: 8000
    scaling_factor: 2.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  build_decontamination_db:
    base_mem_mb: 12000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  run_decontamination:
    base_mem_mb: 12000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  get_read_counts:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  get_read_length_hist:
    base_mem_mb: 8000
    scaling_factor: 12.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  
  ######################
  #### assembly.smk ####
  ######################
  normalize_reads:
    base_mem_mb: 8000
    scaling_factor: 6.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  error_correction:
    base_mem_mb: 8000
    scaling_factor: 6.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  run_assembly:
    base_mem_mb: 12000
    scaling_factor: 6.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  mapping:
    base_mem_mb: 8000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  pileup:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  filter_by_coverage:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  rename_contigs:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  calculate_contigs_stats:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  samtools_stats_contigs_sample:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  create_bam_index:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  
  #####################
  #### binning.smk ####
  #####################
  binning:
    base_mem_mb: 40000
    scaling_factor: 2.0
    threads: *dynamic_default_threads
