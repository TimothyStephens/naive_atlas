#  For more details about the config values see:
#  https://metagenome-atlas.rtfd.io



########################
# Execution parameters
########################
# Default resources for simple or low resource jobs (not requiring dynamic scaling)
simple_job_mem_mb: 5000
simple_job_threads: 8
simple_job_time_min: 1440 # 24 hr

# Resources for rules requiring dynamic scaling (i.e., QC or assembly jobs)
dynamic_threads: &dynamic_default_threads 24
dynamic_time_min: &dynamic_default_time_min 4320 # 72 hr

resources:
  # qc.smk
  initialize_qc:
    base_mem_mb: 2000
    scaling_factor: 0.2
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  deduplicate_reads:
    base_mem_mb: 8000
    scaling_factor: 2.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  apply_quality_filter:
    base_mem_mb: 4000
    scaling_factor: 1.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  build_decontamination_db:
    base_mem_mb: 12000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  run_decontamination:
    base_mem_mb: 12000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  get_read_counts:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  get_read_length_hist:
    base_mem_mb: 4000
    scaling_factor: 0.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  
  # assembly.smk
  normalize_reads:
    base_mem_mb: 8000
    scaling_factor: 2.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  error_correction:
    base_mem_mb: 12000
    scaling_factor: 3.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  run_assembly:
    base_mem_mb: 20000
    scaling_factor: 5.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  mapping:
    base_mem_mb: 8000
    scaling_factor: 1.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  pileup:
    base_mem_mb: 4000
    scaling_factor: 0.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  filter_by_coverage:
    base_mem_mb: 4000
    scaling_factor: 0.5
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  rename_contigs:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  calculate_contigs_stats:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  samtools_stats_contigs_sample:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  create_bam_index:
    base_mem_mb: 2000
    scaling_factor: 0.1
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  predict_genes:
    base_mem_mb: 4000
    scaling_factor: 0.2
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  binning:
    base_mem_mb: 4000
    scaling_factor: 2.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min
  annotation:
    base_mem_mb: 60000
    scaling_factor: 4.0
    threads: *dynamic_default_threads
    time_min: *dynamic_default_time_min


########################
# Paths to reference genomes and databases
########################
# directory where databases are downloaded with 'atlas download'
database_dir: 
  /user/project/dir/databases

tmpdir: 
  /user/project/dir/tmp

# used to trim adapters from reads and read ends
preprocess_adapters: 
  /user/project/dir/databases/adapters.fa

#contamination references can be added such that -- key: /path/to/fasta
contaminant_references:
  PhiX: 
    /user/project/dir/databases/phiX174_virus.fa
  Host_A:
    /user/project/host_refs/Host_A.fa
  Host_B:
    /user/project/host_refs/Host_B.fa



########################
# Annotations
########################
genome_annotations:
- gtdb_tree
- gtdb_taxonomy
- dram
- dram_unbinned
- metaeuk
- metaeuk_unbinned
#- mmseqs2_easy_taxonomy
- mmseqs2_easy_taxonomy_unbinned

gene_annotations:
- eggNOG
- eggNOG_unbinned
- dram
- dram_unbinned
- mmseqs2
- mmseqs2_unbinned
