channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python >=3.8, < 3.12
  - mamba
  - snakemake-minimal=9.17.2
  - pygments
  - networkx
  - graphviz
  - pandas >=1.2, <1.6
  - pyarrow # for parquet reading
  - click >=7
  - ruamel.yaml >=0.17
  - cookiecutter
  - wget
  - apptainer
  - kingfisher
