channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python >=3.8, < 3.12
  - mamba
  - snakemake-minimal=8.5.5
  - pygments
  - networkx
  - graphviz
  - pandas >=1.2, <1.6
  - pyarrow # for parquet reading
  - click >=7
  - ruamel.yaml >=0.17
  - cookiecutter
  - wget
  - apptainer
  - kingfisher
  - pip:
    - snakemake-executor-plugin-slurm==0.2.0
    - snakemake-executor-plugin-cluster-generic==1.0.7
    #- snakemake-logger-plugin-flowo
